name: Build Android APK

# Produces an installable RELEASE APK as a downloadable workflow artifact.
# Release rather than debug because a debug APK needs a Metro dev server to
# start; a release APK has the JS bundled and runs standalone off a sideload.
#
# It is signed with the release key when BANKSPENDS_* secrets are configured,
# and with the debug key otherwise so the build works with no key setup. See
# the signing block in android/app/build.gradle.
#
# Runs on demand, and on pushes that touch anything the APK is built from.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - 'src/**'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-build.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cheap checks first: a type error or a failing parser test should not
      # cost a 20-minute native build to discover.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The runner image already ships the Android SDK with ANDROID_HOME set, so
      # its own sdkmanager is used directly. android-actions/setup-android is
      # deliberately not used: it tries to install the obsolete `tools` package,
      # which no longer exists in the SDK repository, and fails the job.
      #
      # The SDK components android/build.gradle pins are installed explicitly
      # rather than assumed to be in the image - the NDK in particular, which
      # the New Architecture needs for its C++ codegen.
      - name: Install pinned SDK components
        run: |
          set -eux
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006"

      - uses: gradle/actions/setup-gradle@v4

      # Unconditional, with the check inside the script: a step's own `env`
      # block is not reliably visible to that step's `if` expression.
      - name: Decode release keystore
        id: keystore
        env:
          BANKSPENDS_STORE_BASE64: ${{ secrets.BANKSPENDS_STORE_BASE64 }}
        run: |
          if [ -n "$BANKSPENDS_STORE_BASE64" ]; then
            echo "$BANKSPENDS_STORE_BASE64" | base64 -d > android/app/release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing with the configured release key."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No release keystore secret configured - signing with the debug key. Installable on your own phone, but not distributable."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_BANKSPENDS_STORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && 'release.keystore' || '' }}
          ORG_GRADLE_PROJECT_BANKSPENDS_STORE_PASSWORD: ${{ secrets.BANKSPENDS_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_BANKSPENDS_KEY_ALIAS: ${{ secrets.BANKSPENDS_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_BANKSPENDS_KEY_PASSWORD: ${{ secrets.BANKSPENDS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Report APK size and signer
        run: |
          set -x
          ls -lh android/app/build/outputs/apk/release/*.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs \
            android/app/build/outputs/apk/release/app-release.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bank-spends-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        run: rm -f android/app/release.keystore

      # The native build is where this fails if it fails, and the Gradle output
      # alone is rarely enough to tell why.
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
